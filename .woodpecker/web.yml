# Native forge deliveries validate only; publication stays in the manual release workflow.
when:
  - event: pull_request
    path:
      include:
        - apps/web/**
        - .woodpecker/web.yml
      on_empty: false
  - event: push
    branch: main
    path:
      include:
        - apps/web/**
        - .woodpecker/web.yml
      on_empty: false
  - event: manual

steps:
  web-check:
    image: docker.io/oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4
    commands:
      - cd apps/web
      - bun install --frozen-lockfile
      - bunx tsc --noEmit
      - bunx eslint
      - bun test
      - bun --bun next build

  validate-web-image:
    image: quay.io/buildah/stable@sha256:ca4edbaabf71ca330ec9b2714bf8e06c726a6e85ae215cfb1474d2e2c832aacb
    depends_on:
      - web-check
    environment:
      STORAGE_DRIVER: vfs
      BUILDAH_ISOLATION: chroot
    commands:
      - buildah bud --format=oci --storage-driver=vfs --isolation=chroot --tag perlimen/web:ci --file apps/web/Dockerfile apps/web
      - buildah inspect --type image perlimen/web:ci >/dev/null
    backend_options:
      kubernetes:
        securityContext:
          seccompProfile:
            type: Localhost
            localhostProfile: perlimen/buildah.json
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
